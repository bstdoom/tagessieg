# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  workflow_run:
    workflows: ["Import Match", "Build Native Binary"]
    types:
      - completed

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Find latest native binary artifact
        id: native-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow "Build Native Binary" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful Build Native Binary run found on main." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download native binary artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.native-artifact.outputs.run_id }}
          name: tagessieg-native-linux-x64
          path: .cache/tagessieg

      - name: Prepare Temp Directory
        run: |
          chmod +x .cache/tagessieg/tagessieg
          ./.cache/tagessieg/tagessieg -w ./temp init
          touch ./temp/.nojekyll
          touch ./temp/index.html

      - name: Generate Reveal
        run: |
          ./.cache/tagessieg/tagessieg -w ./temp reveal

      - name: Generate Tabler
        run: |
          ./.cache/tagessieg/tagessieg -w ./temp tabler

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload temp directory
          path: './temp'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
