# Let GitHub pass the raw event- and comment-data to cli for processing
name: Import Match
run-name: "Import Match ${{ github.event.issue.title }}"

on:
  issues:
    types: [ closed ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  import-match:
    if: contains(github.event.issue.labels.*.name, 'spieltag') && github.event.issue.state == 'closed'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Find latest native binary artifact
        id: native-artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --repo "${{ github.repository }}" --workflow "Build Native Binary" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [ -z "$run_id" ]; then
            echo "No successful Build Native Binary run found on main." >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download native binary artifact
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.native-artifact.outputs.run_id }}
          name: tagessieg-native-linux-x64
          path: .cache/tagessieg

      # 1. Read the issue and comments from GitHub and write them to match.json
      - name: Parse Event and Comments - Provide match.json
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_JSON: ${{ toJson(github.event) }}
        run: |
          COMMENTS_JSON=$(gh issue view ${{ github.event.issue.number }} --json comments)
          echo "$EVENT_JSON" > event.json
          echo "$COMMENTS_JSON" > comments.json
          cat event.json
          cat comments.json
          jq -n --slurpfile event event.json --slurpfile comments comments.json '{
            id: $event[0].issue.id,
            title: $event[0].issue.title,
            body: $event[0].issue.body,
            created_at: $event[0].issue.created_at,
            closed_at: $event[0].issue.closed_at,
            labels: [$event[0].issue.labels[].name],
            comments: [$comments[0].comments[].body]
          }' > match.json
          cat match.json

      # 2. Run the import-match command
      - name: Import Match to CSV
        run: |
          chmod +x .cache/tagessieg/tagessieg
          ./.cache/tagessieg/tagessieg import -i match.json

      # 3. Commit and Push changes
      - name: Commit and Push
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/*.csv
          git commit -m "Import match ${{ github.event.issue.title }}" || echo "No changes to commit"
          if [ -n "$GH_TOKEN" ]; then
             git push https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          else
             git push
          fi
