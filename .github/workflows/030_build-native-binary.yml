name: Build Native Binary

on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "native/**"
      - "build.gradle.kts"
      - "core/build.gradle.kts"
      - "native/build.gradle.kts"
      - "settings.gradle.kts"
      - ".java-version"
      - ".github/workflows/**"
      - "gradle.properties"
      - "gradle/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up GraalVM from .java-version
        uses: actions/setup-java@v5
        with:
          distribution: "graalvm"
          java-version-file: ".java-version"
          cache: "gradle"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.4.1"

      - name: Build and verify project
        run: ./gradlew build

      - name: Build native executable
        run: ./gradlew :native:nativeCompile

      - name: Stage native executable for artifact upload
        run: |
          mkdir -p .cache/tagessieg
          cp native/build/native/nativeCompile/tagessieg .cache/tagessieg/tagessieg
          chmod +x .cache/tagessieg/tagessieg

      - name: Upload native binary artifact
        uses: actions/upload-artifact@v6
        with:
          name: tagessieg-native-linux-x64
          path: .cache/tagessieg/tagessieg
          if-no-files-found: error
